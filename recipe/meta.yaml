{% set name = "verspec" %}
{% set version = "0.2.1" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/verspec-{{ version }}.tar.gz
  sha256: 2046ea165be01b3ff4a8c2319d0ced57b1d7673fb05b38a75367531acde3b534

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - python >={{ python_min }}

test:
  imports:
    - verspec
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/jimporter/verspec
  summary: Flexible version handling
  license: BSD-2-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - hadim
